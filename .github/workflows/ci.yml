name: ci

on:
  pull_request:
    branches: [main, feat/v0.5-developer-integration, feat/v0.6-execution-model, feat/v0.8-application-runtime, feat/v0.9-stability]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: build-${{ matrix.compiler }}-${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { compiler: gcc, mode: release, build_type: Release, sanitize: "OFF" }
          - { compiler: clang, mode: release, build_type: Release, sanitize: "OFF" }
          - { compiler: gcc, mode: sanitize, build_type: Debug, sanitize: "ON" }
          - { compiler: clang, mode: sanitize, build_type: Debug, sanitize: "ON" }
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Extract source archive
        run: |
          mkdir /tmp/recode-ci-source
          git archive HEAD | tar -x -C /tmp/recode-ci-source
      - name: Configure
        run: |
          cmake -S /tmp/recode-ci-source -B build-ci \
            -DCMAKE_C_COMPILER=${{ matrix.compiler }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DRECODE_SANITIZE=${{ matrix.sanitize }}
      - name: Build
        run: cmake --build build-ci --parallel 2
      - name: Run tests
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build-ci --output-on-failure --timeout 120

  shared-and-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Extract source archive
        run: |
          mkdir /tmp/recode-ci-source
          git archive HEAD | tar -x -C /tmp/recode-ci-source
      - name: Shared library and public consumers
        run: |
          cmake -S /tmp/recode-ci-source -B build-shared -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON
          cmake --build build-shared --parallel 2
          ctest --test-dir build-shared --output-on-failure --timeout 120
      - name: Bounded Clang fuzz smoke
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          cmake -S /tmp/recode-ci-source -B build-fuzz -DCMAKE_C_COMPILER=clang -DCMAKE_BUILD_TYPE=Debug \
            -DRECODE_BUILD_FUZZERS=ON -DBUILD_TESTING=OFF -DRECODE_BUILD_TOOLS=OFF
          cmake --build build-fuzz --parallel 2
          mkdir -p /tmp/recode-corpus
          cp /tmp/recode-ci-source/fuzz/corpus/* /tmp/recode-corpus/
          ./build-fuzz/recode_fuzz /tmp/recode-corpus -runs=100000 -max_len=512 -timeout=5
